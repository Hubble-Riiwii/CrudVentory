<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing | Miguel</title>
    <!-- Links de Bootstrap y estilos de CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <!-- Navbar superior de la página -->
    <header class="container-fluid">
        <nav class="row" id="nav-row">
            <div class="col-lg-1"></div>
            <!-- Columna izquierda del Navbar -->
            <div class="col-lg-6" id="nav-logo-box">
                <div id="nav-logo">LogoTienda</div>
            </div>
            <!-- Columna derecha del Navbar -->
            <div class="col-lg-4" id="nav-menu-box">
                <div class="nav-menu-txt-box">
                    <a href="#" class="nav-menu-txt">Inicio</a>
                </div>
                <div class="nav-menu-txt-box">
                    <a href="#" class="nav-menu-txt">Productos</a>
                </div>
                <div class="nav-menu-txt-box">
                    <a href="#" class="nav-menu-txt">Contacto</a>
                </div>
                <div class="nav-menu-txt-box">
                    <a href="#" class="nav-menu-txt">Carrito</a>
                </div>
            </div>
            <div class="col-lg-1"></div>
        </nav>
    </header>
    <!-- Contenido principal de la página -->
    <main>
        <!-- Sección del Hero -->
        <section class="row" id="hero-row">
            <div class="col-lg-1"></div>
            <!-- Columna izquierda del Hero -->
            <div class="col-lg-5" id="hero-col-left">
                <div id="h1-hero-box">
                    <h1 id="h1-hero">¡Bienvenido a nuestra tienda!</h1>
                    <p class="info">Lorem ipsum, dolor sit amet consectetur adipisicing elit. Quia temporibus asperiores, maxime perferendis expedita ipsa esse atque mollitia alias sit praesentium tenetur autem. Dolorem, atque corporis. Cum facere at fuga?</p>
                    <button class="general-button">Ver Productos</button>
                </div>
            </div>
            <!-- Columna derecha del Hero -->
            <div class="col-lg-5" id="hero-col-right">
                <div id="hero-img-box">
                    <img src="./assets/images/hero.jpeg" alt="hero-img">
                </div>
            </div>
            <div class="col-lg-1"></div>
        </section>
    </main>
</body>
</html>
